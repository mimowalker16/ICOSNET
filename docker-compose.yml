services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-icosnet}
      POSTGRES_USER: ${DB_USER:-icosnet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-icosnet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # NOTE: celery-worker and celery-beat are intentionally NOT in Docker.
  # They run natively on the host (via start.bat) so that PING/TCP/HTTP probes
  # can reach LAN addresses like 192.168.1.1 that are unreachable from inside
  # a Docker container on Windows/macOS.

volumes:
  postgres_data:
